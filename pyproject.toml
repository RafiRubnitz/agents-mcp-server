[project]
name = "inbox-mcp"
version = "0.1.0"
description = "Inbox MCP server: Claude Code sessions message each other, hooks enforce handling by severity"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "loguru>=0.7.3",
    "mcp>=2",
    "sqlalchemy>=2",
    "uvicorn>=0.30",
]

[project.scripts]
inbox-mcp = "inbox_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
